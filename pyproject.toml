[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mediataggerbot"
version = "0.5.9"
description = "Local media metadata matcher, tagger, and renamer."
authors = [{name = "Gateway Information Group LLC"}]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: Microsoft :: Windows"]
keywords = ["music-metadata", "musicbrainz", "acoustid", "media-library", "asset-metadata"]
requires-python = ">=3.11,<3.15"
dependencies = ["requests==2.33.0", "mutagen==1.47.0"]

[project.optional-dependencies]
dev = ["pytest==9.0.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
