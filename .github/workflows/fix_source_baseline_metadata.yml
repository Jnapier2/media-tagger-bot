name: One-use MediaTaggerBot metadata repair

on:
  push:
    branches:
      - agent/fix-source-baseline-metadata-20260810
    paths:
      - .github/workflows/fix_source_baseline_metadata.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mediataggerbot-source-baseline-metadata-repair
  cancel-in-progress: false

jobs:
  repair-verify-and-finalize:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out the dedicated repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/fix-source-baseline-metadata-20260810
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-test.txt

      - name: Preserve Windows launcher line endings in the repair script
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path('.github/scripts/fix_source_baseline_metadata.py')
          text = path.read_text(encoding='utf-8')
          old = '''def write_text(path: Path, text: str) -> None:
              path.write_text(text, encoding="utf-8", newline="\\n")
          '''
          new = '''def write_text(path: Path, text: str) -> None:
              normalized = text.replace("\\r\\n", "\\n").replace("\\r", "\\n")
              newline = "\\r\\n" if path.suffix.lower() in {".bat", ".cmd", ".ps1"} else "\\n"
              path.write_text(normalized, encoding="utf-8", newline=newline)
          '''
          if old not in text:
              raise SystemExit('Expected write_text function was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          '@ | python -

      - name: Apply the bounded metadata repair
        run: python .github/scripts/fix_source_baseline_metadata.py

      - name: Remove one-use repair assets
        shell: pwsh
        run: |
          Remove-Item -LiteralPath .github/scripts/fix_source_baseline_metadata.py -Force
          Remove-Item -LiteralPath .github/workflows/fix_source_baseline_metadata.yml -Force

      - name: Install exact runtime dependencies
        run: "python -m pip install --only-binary=:all: --require-hashes -r requirements.lock.txt"

      - name: Install project and exact test dependencies
        run: |
          python -m pip install --no-deps -e .
          python -m pip install --only-binary=:all: -r requirements-test.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile source and tests
        run: python -m compileall -q src scripts tests

      - name: Run complete regression and safety suite
        run: python -m pytest -q

      - name: Verify final runtime identity and write bounded receipt
        shell: pwsh
        run: |
          @'
          import json
          import os
          import re
          from pathlib import Path
          from mediataggerbot import __build_id__, __version__
          from mediataggerbot.package_identity import verify_runtime_identity

          root = Path.cwd()
          status = verify_runtime_identity(root, __version__, __build_id__)
          print(json.dumps(status, indent=2, ensure_ascii=False))
          assert status['gate_result'] == 'PASS', status['mismatches']
          assert status['package_verified_count'] == status['package_managed_count']
          assert status['mismatch_count'] == 0
          metadata = json.loads((root / 'PACKAGE_METADATA.json').read_text(encoding='utf-8'))
          assert metadata['build_id'] == 'MTB-0.5.9-PUBLIC-20260810-03'
          assert 'source_baseline_sha256' not in metadata
          assert metadata['source_baseline_commit_hash_algorithm'] == 'git-sha1'
          assert re.fullmatch(r'[0-9a-f]{40}', metadata['source_baseline_commit_sha'])
          assert not (root / '.github/scripts/fix_source_baseline_metadata.py').exists()
          assert not (root / '.github/workflows/fix_source_baseline_metadata.yml').exists()
          receipt = {
              'schema': 'MediaTaggerBot.metadata_repair_receipt.v1',
              'version': __version__,
              'build_id': __build_id__,
              'source_baseline_commit_sha': metadata['source_baseline_commit_sha'],
              'source_baseline_commit_hash_algorithm': metadata['source_baseline_commit_hash_algorithm'],
              'parameter_package_sha256': metadata['parameter_package_sha256'],
              'manifest_record_count': status['manifest_record_count'],
              'package_managed_count': status['package_managed_count'],
              'package_verified_count': status['package_verified_count'],
              'mismatch_count': status['mismatch_count'],
              'gate_result': status['gate_result'],
              'behavior_change': False,
              'dependency_change': False,
              'rights_notice': 'Copyright © 2026 Gateway Information Group LLC. All rights reserved.',
          }
          destination = Path(os.environ['RUNNER_TEMP']) / 'MediaTaggerBot_v0.5.9_metadata_repair_receipt.json'
          destination.write_text(json.dumps(receipt, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          '@ | python -
          git diff --check

      - name: Upload bounded repair evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: mediataggerbot-metadata-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/MediaTaggerBot_v0.5.9_metadata_repair_receipt.json
          if-no-files-found: error
          compression-level: 9
          retention-days: 14

      - name: Commit only the verified final source tree
        shell: pwsh
        run: |
          git add -A
          if (git diff --cached --quiet) {
            throw 'The metadata repair produced no reviewable source changes.'
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $body = @'
          Correct a Git commit SHA-1 that was mislabeled as SHA-256, reconcile the v2.17.6 source-provenance record, clean release-note ordering, advance the transparent build ID, regenerate managed-file evidence, and preserve v0.5.9 runtime behavior and dependencies.

          Copyright © 2026 Gateway Information Group LLC. All rights reserved.
          '@
          git commit -m "Correct MediaTaggerBot source-baseline metadata" -m $body
          git push origin HEAD:agent/fix-source-baseline-metadata-20260810

# Copyright © 2026 Gateway Information Group LLC. All rights reserved.
