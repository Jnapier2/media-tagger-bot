name: Apply reviewed runtime findings

on:
  workflow_dispatch:
  push:
    branches:
      - release/public-v0.5.9-v2175
    paths:
      - .github/workflows/fix-review-findings.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install exact test dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements.txt
          python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Apply, validate, and commit review fixes
        run: python tools/retry_fix_review_findings.py

# Retry 2: regressions are added to the existing managed v0.5.7 hardening module.
