name: Apply reviewed MediaTaggerBot v0.5.9 public source

on:
  push:
    branches: [agent/publish-mtb-v059-20260808]

permissions:
  contents: write

concurrency:
  group: mtb-v059-public-source
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Patch and apply exact sanitized public source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/patch_public_reconciler.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/apply_public_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install exact runtime and test tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --no-index --find-links wheels --require-hashes -r requirements.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements-test.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile, test, and verify release identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m compileall -q src scripts tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          from pathlib import Path
          from mediataggerbot.package_identity import verify_runtime_identity
          result = verify_runtime_identity(Path.cwd(), "0.5.9", "MTB-0.5.9-B20260807-01")
          print(result)
          raise SystemExit(0 if result["gate_result"] == "PASS" else 1)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit verified public source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "Publish sanitized MediaTaggerBot v0.5.9 source"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:agent/publish-mtb-v059-20260808
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
