name: Apply reviewed public source payload

on:
  workflow_dispatch:
  push:
    branches:
      - release/public-v0.5.9-v2175
    paths:
      - .github/workflows/apply-public-source.yml

permissions:
  contents: write

concurrency:
  group: mediatagger-public-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out publication branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Apply, validate, and commit reviewed source
        run: python tools/apply_public_source.py

