name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-test.txt
      - name: Install exact runtime dependencies
        id: runtime_install
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock.txt *> runtime-install.txt
          $exitCode = $LASTEXITCODE
          Get-Content -LiteralPath runtime-install.txt
          exit $exitCode
      - name: Upload runtime-install diagnostics
        if: ${{ failure() && steps.runtime_install.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: runtime-install-python-${{ matrix.python-version }}
          path: runtime-install.txt
          if-no-files-found: error
          compression-level: 9
          retention-days: 7
      - name: Install the local project without dependency resolution
        run: python -m pip install --no-deps -e .
      - name: Install exact test dependencies
        run: >-
          python -m pip install --only-binary=:all: -r requirements-test.txt
      - name: Verify installed dependency consistency
        id: pip_check
        shell: pwsh
        run: |
          python -m pip check *> pip-check.txt
          $exitCode = $LASTEXITCODE
          Get-Content -LiteralPath pip-check.txt
          exit $exitCode
      - name: Upload dependency-check diagnostics
        if: ${{ failure() && steps.pip_check.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: dependency-check-python-${{ matrix.python-version }}
          path: pip-check.txt
          if-no-files-found: error
          compression-level: 9
          retention-days: 7
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Test
        run: python -m pytest -q

